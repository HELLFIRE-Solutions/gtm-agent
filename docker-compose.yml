# Deploys the chat widget inbox endpoint only (gtm_agent.inbox.server) --
# the CLI/orchestrator is not containerized, same reasoning as
# internal-db/rag-01's own docker-compose.yml files: one small persistent
# service, not a full app platform. Joins internal-db's own network so it
# can resolve the `db` container by name rather than depending on the
# host-bound port -- see internal-db/docs/SCHEMA.md for the scoped
# marketing_app role this connects as.
# mem_limit/cpus: H-2 fix (shared 164.90.235.66 droplet, TETA+PI's
# user-1001.slice caps don't reach containers on the host docker daemon --
# see STATE.md "Session 02 (continued) -- co-tenant security findings").
# Measured actual RSS 2026-09-27: ~4-5 MiB (a stdlib HTTP server handling
# the chat-widget inbox, no in-process cache/queue). 256m is ~50x that --
# enough headroom for connection bursts or a slow GC day, tight enough that
# a real leak hits the cap long before it can starve internal-db or the
# other two tenants on this 2GB box. cpus caps it at half the box's single
# vCPU so a runaway loop here can't starve internal-db's queries either.
services:
  inbox:
    build: .
    restart: unless-stopped
    env_file: .env
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:${INBOX_PORT:-8090}:8090"
    networks:
      - internal-db_default

networks:
  internal-db_default:
    external: true
